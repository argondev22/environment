name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v24

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # zsh スクリプト（pc/bin/manual/）は shellcheck 非対応なので対象外
      - name: shellcheck
        run: git ls-files '*.sh' ':!:pc/bin/manual' | xargs shellcheck
