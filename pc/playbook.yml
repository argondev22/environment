- hosts: local
  gather_facts: true
  vars:
    paths:
      home: "{{ ansible_env.HOME }}"
      chezmoi_config: "{{ ansible_env.HOME }}/.config/chezmoi"
      age_config: "{{ ansible_env.HOME }}/.config/age"
      age_key: "{{ ansible_env.HOME }}/.config/age/age.key"
      chezmoi_source: "{{ ansible_env.HOME }}/.local/share/chezmoi"
      zshrc: "{{ ansible_env.HOME }}/.zshrc"
      tool_versions: "{{ ansible_env.HOME }}/.tool-versions"
      brewfile: "{{ ansible_env.HOME }}/.Brewfile"

  pre_tasks:
    - name: Require macOS
      fail:
        msg: "This playbook supports macOS only (detected {{ ansible_facts.os_family }}/{{ ansible_facts.machine }})"
      when: ansible_facts.os_family != "Darwin"

    - name: Set Homebrew paths (arm64 -> /opt/homebrew, intel -> /usr/local)
      set_fact:
        brew:
          bin: "{{ brew_prefix }}/bin"
          prefix: "{{ brew_prefix }}"
          zsh: "{{ brew_prefix }}/bin/zsh"
      vars:
        brew_prefix: "{{ '/opt/homebrew' if ansible_facts.machine == 'arm64' else '/usr/local' }}"

    - name: Set asdf configuration
      set_fact:
        asdf_sh: "{{ brew.prefix }}/opt/asdf/libexec/asdf.sh"
        asdf_env:
          ASDF_DIR: "{{ brew.prefix }}/opt/asdf/libexec"
          PATH: "{{ ansible_env.PATH }}:{{ brew.prefix }}/opt/asdf/shims:{{ brew.prefix }}/opt/asdf/bin"

  tasks:
    # ---------------------------------------------------------------
    # Homebrew + コアパッケージ
    # ---------------------------------------------------------------
    - name: Setup Homebrew and core packages
      block:
        - name: Check Homebrew installation
          command: "{{ brew.bin }}/brew --version"
          register: brew_check
          changed_when: false
          failed_when: false

        - name: Install Homebrew
          shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          when: brew_check.rc != 0
          environment:
            NONINTERACTIVE: "1"
            HOME: "{{ paths.home }}"
            USER: "{{ ansible_user_id }}"

        - name: Install core dependencies
          community.general.homebrew:
            name: [unzip, gnupg]
            state: present

        - name: Install core packages
          community.general.homebrew:
            name: [zsh, chezmoi, age, asdf]
            state: present

    # ---------------------------------------------------------------
    # zsh
    # ---------------------------------------------------------------
    - name: Configure zsh
      block:
        - name: Install zplug
          git:
            repo: "https://github.com/zplug/zplug"
            dest: "{{ paths.home }}/.zplug"
            version: "master"
            update: false

        - name: Register zsh in /etc/shells
          lineinfile:
            path: /etc/shells
            line: "{{ brew.zsh }}"
            state: present
          become: true

        - name: Set zsh as default shell
          user:
            name: "{{ ansible_user_id }}"
            shell: "{{ brew.zsh }}"
          become: true

    # ---------------------------------------------------------------
    # homedir (age + chezmoi)
    # ---------------------------------------------------------------
    - name: Setup homedir
      environment:
        AGE_IDENTITIES_FILE: "{{ paths.age_key }}"
      block:
        - name: Ensure ~/.ssh exists
          file:
            path: "{{ paths.home }}/.ssh"
            state: directory
            mode: '0700'

        # chezmoi init と、.chezmoiexternal.toml の git-repo (Vault/Memory) は
        # SSH (git@github.com:...) を使う。github.com の鍵が known_hosts に
        # 無いと初回接続で TOFU 確認("yes/no")が入るが、command モジュール経由
        # では stdin が繋がらず応答できず失敗する。事前に信頼しておくことで
        # 対話プロンプトの発生自体を無くす。
        - name: Trust GitHub's SSH host key
          ansible.builtin.known_hosts:
            name: github.com
            key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519,rsa github.com 2>/dev/null') }}"
            path: "{{ paths.home }}/.ssh/known_hosts"
            state: present

        - name: Create config directories
          file:
            path: "{{ item.path }}"
            state: directory
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ paths.chezmoi_config }}", mode: '0755' }
            - { path: "{{ paths.age_config }}", mode: '0700' }

        - name: Deploy age private key
          copy:
            content: "{{ age_private_key_content }}"
            dest: "{{ paths.age_key }}"
            mode: '0600'
          no_log: true

        - name: Extract age public key
          command: "{{ brew.bin }}/age-keygen -y {{ paths.age_key }}"
          register: age_keygen_result
          changed_when: false

        - name: Generate chezmoi configuration
          template:
            src: chezmoi.toml.j2
            dest: "{{ paths.chezmoi_config }}/chezmoi.toml"
            mode: '0644'
          vars:
            age_public_key: "{{ age_keygen_result.stdout.strip() }}"
            age_key_file: "{{ paths.age_key }}"
            brew_bin: "{{ brew.bin }}"
            brew_prefix: "{{ brew.prefix }}"
            asdf_dir: "{{ brew.prefix }}/opt/asdf/libexec"
            asdf_sh: "{{ brew.prefix }}/opt/asdf/libexec/asdf.sh"

        - name: Check existing chezmoi repository
          stat:
            path: "{{ paths.chezmoi_source }}"
          register: repo_exists

        - name: Initialize chezmoi repository
          command: "{{ brew.bin }}/chezmoi init {{ chezmoi_repo_url }}"
          when: not repo_exists.stat.exists

        - name: Update chezmoi repository
          command: "git -C {{ paths.chezmoi_source }} pull"
          register: git_pull
          changed_when: "'Already up to date.' not in git_pull.stdout"
          when: repo_exists.stat.exists

        - name: Apply homedir
          command: "{{ brew.bin }}/chezmoi apply"
          register: chezmoi_apply
          changed_when: false
          no_log: true

        - name: Create asdf compatibility symlink
          file:
            src: "{{ brew.prefix }}/opt/asdf"
            dest: "{{ paths.home }}/.asdf"
            state: link
            force: true

    # ---------------------------------------------------------------
    # 言語ツール (.tool-versions を asdf に委譲)
    # ---------------------------------------------------------------
    - name: Check .tool-versions exists
      stat:
        path: "{{ paths.tool_versions }}"
      register: tool_versions_file

    - name: Install tools from .tool-versions (asdf)
      when: tool_versions_file.stat.exists
      environment: "{{ asdf_env }}"
      block:
        - name: Read .tool-versions
          slurp:
            src: "{{ paths.tool_versions }}"
          register: tool_versions_raw

        - name: Extract asdf plugin names
          set_fact:
            asdf_plugins: >-
              {{
                (tool_versions_raw.content | b64decode).splitlines()
                | map('trim') | reject('match', '^(#|$)')
                | map('regex_replace', '\s.*$', '') | list
              }}

        - name: Add asdf plugins
          shell: '. "{{ asdf_sh }}" && asdf plugin add {{ item }}'
          args:
            executable: /bin/bash
          loop: "{{ asdf_plugins }}"
          changed_when: false
          failed_when: false

        - name: Import nodejs release-team keyring
          shell: '. "{{ asdf_sh }}" && bash ~/.asdf/plugins/nodejs/bin/import-release-team-keyring'
          args:
            executable: /bin/bash
          when: "'nodejs' in asdf_plugins"
          changed_when: false
          failed_when: false

        - name: Install tools (asdf reads .tool-versions itself)
          shell: '. "{{ asdf_sh }}" && cd "{{ paths.home }}" && asdf install'
          args:
            executable: /bin/bash
          register: asdf_install
          changed_when: "'Downloading' in asdf_install.stdout or 'Installing' in asdf_install.stdout"
          failed_when: false

        - name: Reshim asdf
          shell: '. "{{ asdf_sh }}" && asdf reshim'
          args:
            executable: /bin/bash
          changed_when: false

    # ---------------------------------------------------------------
    # Homebrew パッケージ (Brewfile = 宣言的な唯一の真実)
    # ---------------------------------------------------------------
    - name: Check Brewfile exists
      stat:
        path: "{{ paths.brewfile }}"
      register: brewfile_check

    - name: Install packages from Brewfile
      command: "{{ brew.bin }}/brew bundle --file={{ paths.brewfile }}"
      register: brew_bundle
      changed_when: "'Installing' in brew_bundle.stdout or 'Upgrading' in brew_bundle.stdout"
      when: brewfile_check.stat.exists

    # ---------------------------------------------------------------
    # 宣言化しづらいものは bin/*.sh に委譲（各スクリプトが冪等前提・非対話前提）
    #
    # 対話確認が必要なスクリプト（例: npx の確認プロンプトに答えたいもの）は
    # bin/manual/ に置く。Ansible の command/shell タスクは stdin が繋がらず
    # 対話プロンプトに答えられないため、bin/ 直下（非再帰探索）には置かない。
    # bin/manual/ 配下はこの playbook からは実行せず、オペレーターが自分の
    # 端末で直接実行する（bootstrap スキルが案内する）。
    # ---------------------------------------------------------------
    - name: Run custom install scripts (bin/*.sh)
      block:
        - name: Discover custom scripts
          ansible.builtin.find:
            paths: "{{ playbook_dir }}/bin"
            patterns: "*.sh"
            file_type: file
          register: custom_scripts_found

        - name: Execute custom scripts
          shell: '"{{ item }}"'
          args:
            executable: /bin/bash
          loop: "{{ custom_scripts_found.files | map(attribute='path') | list }}"
          loop_control:
            label: "{{ item | basename }}"
          register: custom_script_exec
          changed_when: custom_script_exec.rc == 0
          failed_when: false
          environment:
            HOME: "{{ paths.home }}"
            BREW_BIN: "{{ brew.bin }}"
            BREW_PREFIX: "{{ brew.prefix }}"
            PATH: "{{ brew.bin }}:{{ ansible_env.PATH }}"

    # ---------------------------------------------------------------
    # 軽いサマリー（トラブルシュート用・Ansibleのrecapを補う最小限）
    # ---------------------------------------------------------------
    - name: Summary
      block:
        - name: Collect Homebrew status
          command: "{{ brew.bin }}/brew --version"
          register: sum_brew
          changed_when: false
          failed_when: false

        - name: Collect homedir status
          command: "{{ brew.bin }}/chezmoi status"
          register: sum_chezmoi
          changed_when: false
          failed_when: false

        - name: Collect asdf current versions
          shell: '. "{{ asdf_sh }}" && asdf current'
          args:
            executable: /bin/bash
          environment: "{{ asdf_env }}"
          register: sum_asdf
          changed_when: false
          failed_when: false
          when: tool_versions_file.stat.exists

        - name: Show summary
          debug:
            msg:
              - "==================== Setup Summary ===================="
              - "Homebrew      : {{ 'OK' if sum_brew.rc == 0 else 'FAILED' }} ({{ brew.bin }})"
              - "Default shell : {{ brew.zsh }}"
              - "Brewfile      : {{ 'applied' if brewfile_check.stat.exists else 'not found (skipped)' }}"
              - "Homedir       : {{ 'clean' if (sum_chezmoi.stdout | default('')) == '' else 'PENDING CHANGES ↓' }}"
              - "{{ sum_chezmoi.stdout_lines | default([]) }}"
              - "asdf tools    :"
              - "{{ sum_asdf.stdout_lines | default(['(.tool-versions not found)']) }}"
              - "======================================================"
              - "詳細な変更/失敗は上の PLAY RECAP と各タスク結果を参照"
