- hosts: local
  gather_facts: true
  vars:
    paths:
      home: "{{ ansible_env.HOME }}"
      chezmoi_config: "{{ ansible_env.HOME }}/.config/chezmoi"
      age_config: "{{ ansible_env.HOME }}/.config/age"
      age_key: "{{ ansible_env.HOME }}/.config/age/age.key"
      # Environment リポジトリ（このファイルの親ディレクトリ）と、そのサブモジュール homedir（= chezmoi のソース）
      environment: "{{ playbook_dir | dirname }}"
      chezmoi_source: "{{ playbook_dir | dirname }}/homedir"
      zshrc: "{{ ansible_env.HOME }}/.zshrc"
      mise_config: "{{ ansible_env.HOME }}/.config/mise/config.toml"
      brewfile: "{{ ansible_env.HOME }}/.Brewfile"

  pre_tasks:
    - name: Require macOS
      fail:
        msg: "This playbook supports macOS only (detected {{ ansible_facts.os_family }}/{{ ansible_facts.machine }})"
      when: ansible_facts.os_family != "Darwin"

    - name: Set Homebrew paths (arm64 -> /opt/homebrew, intel -> /usr/local)
      set_fact:
        brew:
          bin: "{{ brew_prefix }}/bin"
          prefix: "{{ brew_prefix }}"
          zsh: "{{ brew_prefix }}/bin/zsh"
      vars:
        brew_prefix: "{{ '/opt/homebrew' if ansible_facts.machine == 'arm64' else '/usr/local' }}"

  tasks:
    # ---------------------------------------------------------------
    # Homebrew + コアパッケージ（基盤: zsh・chezmoi・age。日常ツールは Brewfile、開発ツールは mise）
    # ---------------------------------------------------------------
    - name: Setup Homebrew and core packages
      block:
        - name: Check Homebrew installation
          command: "{{ brew.bin }}/brew --version"
          register: brew_check
          changed_when: false
          failed_when: false

        - name: Install Homebrew
          shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          when: brew_check.rc != 0
          environment:
            NONINTERACTIVE: "1"
            HOME: "{{ paths.home }}"
            USER: "{{ ansible_user_id }}"

        - name: Install core packages
          community.general.homebrew:
            name: [zsh, chezmoi, age]
            state: present

    # ---------------------------------------------------------------
    # zsh
    # ---------------------------------------------------------------
    - name: Configure zsh
      block:
        - name: Install zplug
          git:
            repo: "https://github.com/zplug/zplug"
            dest: "{{ paths.home }}/.zplug"
            version: "master"
            update: false

        - name: Register zsh in /etc/shells
          lineinfile:
            path: /etc/shells
            line: "{{ brew.zsh }}"
            state: present
          become: true

        - name: Set zsh as default shell
          user:
            name: "{{ ansible_user_id }}"
            shell: "{{ brew.zsh }}"
          become: true

    # ---------------------------------------------------------------
    # homedir (age + chezmoi)
    # ---------------------------------------------------------------
    - name: Setup homedir
      environment:
        AGE_IDENTITIES_FILE: "{{ paths.age_key }}"
      block:
        - name: Ensure ~/.ssh exists
          file:
            path: "{{ paths.home }}/.ssh"
            state: directory
            mode: '0700'

        # homedir サブモジュールの取得と、.chezmoiexternal.toml の git-repo は
        # SSH (git@github.com:...) を使う。github.com の鍵が known_hosts に
        # 無いと初回接続で TOFU 確認("yes/no")が入るが、command モジュール経由
        # では stdin が繋がらず応答できず失敗する。事前に信頼しておくことで
        # 対話プロンプトの発生自体を無くす。
        - name: Trust GitHub's SSH host key
          ansible.builtin.known_hosts:
            name: github.com
            key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519,rsa github.com 2>/dev/null') }}"
            path: "{{ paths.home }}/.ssh/known_hosts"
            state: present

        - name: Create config directories
          file:
            path: "{{ item.path }}"
            state: directory
            mode: "{{ item.mode }}"
          loop:
            - { path: "{{ paths.chezmoi_config }}", mode: '0755' }
            - { path: "{{ paths.age_config }}", mode: '0700' }

        - name: Deploy age private key
          copy:
            content: "{{ age_private_key_content }}"
            dest: "{{ paths.age_key }}"
            mode: '0600'
          no_log: true

        - name: Extract age public key
          command: "{{ brew.bin }}/age-keygen -y {{ paths.age_key }}"
          register: age_keygen_result
          changed_when: false

        - name: Generate chezmoi configuration
          template:
            src: chezmoi.toml.j2
            dest: "{{ paths.chezmoi_config }}/chezmoi.toml"
            mode: '0644'
          vars:
            age_public_key: "{{ age_keygen_result.stdout.strip() }}"
            age_key_file: "{{ paths.age_key }}"
            chezmoi_source: "{{ paths.chezmoi_source }}"
            brew_bin: "{{ brew.bin }}"
            brew_prefix: "{{ brew.prefix }}"

        # chezmoi のソースは Environment のサブモジュール homedir（chezmoi.toml の sourceDir）。
        # 新 PC では Environment を --recurse-submodules で clone しておくのが確実
        # （ここでの init には GitHub への SSH 認証が要る）。
        - name: Check homedir submodule
          stat:
            path: "{{ paths.chezmoi_source }}/.git"
          register: homedir_git

        # 初期化済みの homedir に対して `git submodule update` は使わない
        # （記録されたコミットに戻して detached HEAD にしてしまうため）。
        - name: Initialize homedir submodule
          command: "git -C {{ paths.environment }} submodule update --init homedir"
          when: not homedir_git.stat.exists

        # homedir を main に載せて ff-only で最新化する（冪等）。
        # 未コミットの変更・未 push のコミット・履歴の分岐があれば何も変えずスキップし、
        # メッセージを出す（失敗にはしない）。
        - name: Update homedir (main, fast-forward only)
          shell: |
            set -eu
            cd "{{ paths.chezmoi_source }}"
            if [ -n "$(git status --porcelain)" ]; then
              echo "SKIP: homedir に未コミットの変更があるため更新しませんでした"
              exit 0
            fi
            git fetch -q origin main
            cur="$(git symbolic-ref -q --short HEAD || true)"
            if [ "$cur" != main ]; then
              if ! git merge-base --is-ancestor HEAD origin/main; then
                echo "SKIP: homedir の HEAD に origin/main へ含まれないコミットがあるため更新しませんでした"
                exit 0
              fi
              git switch -q main 2>/dev/null || git switch -q -c main --track origin/main
              echo "CHANGED: homedir を main に切り替えました"
            fi
            counts="$(git rev-list --left-right --count main...origin/main)"
            ahead="${counts%%[[:space:]]*}"
            behind="${counts##*[[:space:]]}"
            if [ "$ahead" -gt 0 ]; then
              echo "SKIP: homedir に未 push のコミットがあるため更新しませんでした"
              exit 0
            fi
            if [ "$behind" -gt 0 ]; then
              git merge -q --ff-only origin/main
              echo "CHANGED: homedir を origin/main に更新しました"
            fi
          args:
            executable: /bin/bash
          register: homedir_update
          changed_when: "'CHANGED' in homedir_update.stdout"

        - name: Report homedir update result
          debug:
            msg: "{{ homedir_update.stdout_lines }}"
          when: homedir_update.stdout is defined and homedir_update.stdout | length > 0

        - name: Require homedir source for chezmoi
          stat:
            path: "{{ paths.chezmoi_source }}/.git"
          register: homedir_ready
          failed_when: not ansible_check_mode and not homedir_ready.stat.exists

        - name: Apply homedir
          command: "{{ brew.bin }}/chezmoi apply"
          register: chezmoi_apply
          changed_when: false
          no_log: true

    # ---------------------------------------------------------------
    # Homebrew パッケージ (Brewfile = 宣言的な唯一の真実)
    # ---------------------------------------------------------------
    - name: Check Brewfile exists
      stat:
        path: "{{ paths.brewfile }}"
      register: brewfile_check

    - name: Install packages from Brewfile
      command: "{{ brew.bin }}/brew bundle --file={{ paths.brewfile }}"
      register: brew_bundle
      changed_when: "'Installing' in brew_bundle.stdout or 'Upgrading' in brew_bundle.stdout"
      when: brewfile_check.stat.exists

    # ---------------------------------------------------------------
    # 開発ツール (~/.config/mise/config.toml を mise に委譲)
    # mise 本体は Brewfile で入る。グローバル既定のツールだけをここで入れる
    # ---------------------------------------------------------------
    - name: Check mise installation
      stat:
        path: "{{ brew.bin }}/mise"
      register: mise_bin

    - name: Check mise global config exists
      stat:
        path: "{{ paths.mise_config }}"
      register: mise_config_file

    - name: Install tools from mise global config
      when: mise_bin.stat.exists and mise_config_file.stat.exists
      environment:
        HOME: "{{ paths.home }}"
        PATH: "{{ brew.bin }}:{{ ansible_env.PATH }}"
      block:
        - name: Find missing mise tools
          command: "{{ brew.bin }}/mise ls --missing"
          args:
            chdir: "{{ paths.home }}"
          register: mise_missing
          changed_when: false

        - name: Install missing mise tools
          command: "{{ brew.bin }}/mise install"
          args:
            chdir: "{{ paths.home }}"
          register: mise_install
          changed_when: true
          when: mise_missing.stdout | default('') | trim | length > 0

    # ---------------------------------------------------------------
    # 宣言化しづらいものは bin/*.sh に委譲（各スクリプトが冪等前提・非対話前提）
    #
    # 対話確認が必要なスクリプト（例: npx の確認プロンプトに答えたいもの）は
    # bin/manual/ に置く。Ansible の command/shell タスクは stdin が繋がらず
    # 対話プロンプトに答えられないため、bin/ 直下（非再帰探索）には置かない。
    # bin/manual/ 配下はこの playbook からは実行せず、オペレーターが自分の
    # 端末で直接実行する（bootstrap スキルが案内する）。
    # ---------------------------------------------------------------
    - name: Run custom install scripts (bin/*.sh)
      block:
        - name: Discover custom scripts
          ansible.builtin.find:
            paths: "{{ playbook_dir }}/bin"
            patterns: "*.sh"
            file_type: file
          register: custom_scripts_found

        - name: Execute custom scripts
          shell: '"{{ item }}"'
          args:
            executable: /bin/bash
          loop: "{{ custom_scripts_found.files | map(attribute='path') | list }}"
          loop_control:
            label: "{{ item | basename }}"
          register: custom_script_exec
          changed_when: custom_script_exec.rc == 0
          failed_when: false
          environment:
            HOME: "{{ paths.home }}"
            BREW_BIN: "{{ brew.bin }}"
            BREW_PREFIX: "{{ brew.prefix }}"
            PATH: "{{ brew.bin }}:{{ ansible_env.PATH }}"

    # ---------------------------------------------------------------
    # 軽いサマリー（トラブルシュート用・Ansibleのrecapを補う最小限）
    # ---------------------------------------------------------------
    - name: Summary
      block:
        - name: Collect Homebrew status
          command: "{{ brew.bin }}/brew --version"
          register: sum_brew
          changed_when: false
          failed_when: false

        - name: Collect homedir status
          command: "{{ brew.bin }}/chezmoi status"
          register: sum_chezmoi
          changed_when: false
          failed_when: false

        - name: Collect mise current versions
          command: "{{ brew.bin }}/mise ls --current"
          args:
            chdir: "{{ paths.home }}"
          environment:
            HOME: "{{ paths.home }}"
            PATH: "{{ brew.bin }}:{{ ansible_env.PATH }}"
          register: sum_mise
          changed_when: false
          failed_when: false
          when: mise_bin.stat.exists and mise_config_file.stat.exists

        - name: Show summary
          debug:
            msg:
              - "==================== Setup Summary ===================="
              - "Homebrew      : {{ 'OK' if sum_brew.rc == 0 else 'FAILED' }} ({{ brew.bin }})"
              - "Default shell : {{ brew.zsh }}"
              - "Brewfile      : {{ 'applied' if brewfile_check.stat.exists else 'not found (skipped)' }}"
              - "Homedir source: {{ paths.chezmoi_source }}"
              - "Homedir       : {{ 'clean' if (sum_chezmoi.stdout | default('')) == '' else 'PENDING CHANGES ↓' }}"
              - "{{ sum_chezmoi.stdout_lines | default([]) }}"
              - "mise tools    :"
              - "{{ sum_mise.stdout_lines | default(['(mise or ~/.config/mise/config.toml not found)']) }}"
              - "======================================================"
              - "詳細な変更/失敗は上の PLAY RECAP と各タスク結果を参照"
